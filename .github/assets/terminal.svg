<svg xmlns="http://www.w3.org/2000/svg" width="872" height="320" viewBox="0 0 872 320" role="img" aria-label="lintero and formatero in a terminal">
    <title>lintero and formatero checking and fixing a module</title>
    <rect width="872" height="320" rx="8" fill="#0d1117"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="16" r="5" fill="#27c93f"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
        <text x="24" y="44" fill="#7ee787">$ npx lintero</text>
        <text x="24" y="64" fill="#ff7b72">error: sum.ts:1:1 assist/source/organizeImports: Sort these imports.</text>
        <text x="24" y="84" fill="#ff7b72">error: sum.ts:5:3 lint/suspicious/noDebugger: This is an unexpected use of the debugger statement.</text>
        <text x="24" y="104" fill="#c9d1d9">Found 2 errors, 0 warnings and 0 infos.</text>
        <text x="24" y="124" fill="#7ee787">$ npx lintero --write --unsafe</text>
        <text x="24" y="144" fill="#79c0ff">fixed: sum.ts</text>
        <text x="24" y="164" fill="#c9d1d9">Found 0 errors, 0 warnings and 0 infos.</text>
        <text x="24" y="184" fill="#7ee787">$ npx formatero</text>
        <text x="24" y="204" fill="#79c0ff">unformatted: sum.ts</text>
        <text x="24" y="224" fill="#7ee787">$ npx formatero --write</text>
        <text x="24" y="244" fill="#79c0ff">formatted: sum.ts</text>
        <text x="24" y="264" fill="#7ee787">$ npx formatero &amp;&amp; npx lintero</text>
        <text x="24" y="284" fill="#c9d1d9">Found 0 errors, 0 warnings and 0 infos.</text>
    </g>
</svg>
