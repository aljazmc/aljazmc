name: CI
run-name: CI quickie by @${{ github.actor }}

on:
    # a passing run of a push to main starts publish.yml
    push:
        branches: [main]
    pull_request:
        branches: [main]
        # package.json for the dependency updates Dependabot opens
        paths: [".github/**", "package.json", "packages/**", "shared/**"]
    # run by hand from the Actions tab: checks everything
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        runs-on: ubuntu-latest
        env:
            NODE_ENV: development
            NODE_NO_WARNINGS: "1"

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Detect changed packages
              id: changes
              env:
                  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: |
                  all=$(for d in packages/*/; do basename "$d"; done | xargs)
                  shared=false
                  if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                      changed=$(git diff --name-only "$BASE" HEAD)
                      check=$(echo "$changed" | sed -nE 's#^packages/([^/]+)/.*#\1#p' | sort -u | xargs)
                      if echo "$changed" | grep -q '^shared/'; then
                          echo "Shared code changed, it is bundled into every package."
                          shared=true
                          check=$all
                      fi
                      if echo "$changed" | grep -qE '^(\.github/|package\.json$)'; then
                          echo "Workflows or root package.json changed, checking everything."
                          shared=true
                          check=$all
                      fi
                  else
                      echo "Base commit not found, checking everything."
                      shared=true
                      check=$all
                  fi
                  {
                      echo "shared=$shared"
                      echo "check=$check"
                  } | tee -a "$GITHUB_OUTPUT"

            - name: Check shared code
              if: steps.changes.outputs.shared == 'true'
              run: |
                  yarn c:config
                  yarn c:syntax

            - name: Check changed packages
              if: steps.changes.outputs.check != ''
              env:
                  PACKAGES: ${{ steps.changes.outputs.check }}
              run: |
                  for p in $PACKAGES; do
                      echo "::group::$p"
                      yarn "c:$p"
                      node "packages/$p/bin/main.js"
                      echo "::endgroup::"
                  done
