name: CI/CD
run-name: CI/CD quickie by @${{ github.actor }}

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    id-token: write
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    cicd:
        runs-on: ubuntu-latest
        env:
            NODE_ENV: development
            NODE_NO_WARNINGS: "1"
            NODE_OPTIONS: "--experimental-vm-modules"

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Prepare '/opt/hostedtoolcache'
              run: |
                  sudo mkdir -p /opt/hostedtoolcache
                  sudo chown -R "$(whoami)" /opt/hostedtoolcache

            - name: Install package manager
              run: |
                  corepack enable
                  corepack install
                  yarn install --mode update-lockfile

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  node-version: "latest"
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lint and check formatting
              run: yarn l:all

            - name: Build packages
              run: yarn b:all

            - name: Export types
              run: yarn et:all

            - name: Run tests
              run: yarn t:all

            - name: Verify that CLI is executable
              run: |
                  node packages/formatero/bin/main.js
                  node packages/lintero/bin/main.js
                  node packages/monorepo/bin/main.js
                  node packages/testero/bin/main.js

            - name: Publish changed packages
              if: github.event_name == 'push'
              env:
                  BEFORE: ${{ github.event.before }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                      yarn workspaces foreach --no-private --include 'packages/*' \
                          --since="$BEFORE" \
                          npm publish --access public --tolerate-republish
                  else
                      yarn p:all
                  fi
