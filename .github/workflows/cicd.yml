name: CI/CD
run-name: CI/CD quickie by @${{ github.actor }}

on:
    # every push, changes outside of the packages version the root package.json
    push:
        branches: [main]
    pull_request:
        branches: [main]
        paths: [".github/workflows/**", "packages/**", "shared/**"]
    # run by hand from the Actions tab: checks everything
    workflow_dispatch:
        inputs:
            publish:
                description: Version changed packages and publish the versions that are not on npm yet
                type: boolean
                default: false

permissions:
    id-token: write
    # pushing the version commits and tags
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    cicd:
        runs-on: ubuntu-latest
        env:
            NODE_ENV: development
            NODE_NO_WARNINGS: "1"
            NODE_OPTIONS: "--experimental-vm-modules"

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Prepare '/opt/hostedtoolcache'
              run: |
                  sudo mkdir -p /opt/hostedtoolcache
                  sudo chown -R "$(whoami)" /opt/hostedtoolcache

            - name: Install package manager
              run: |
                  corepack enable
                  corepack install
                  yarn install --mode update-lockfile

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  node-version: "latest"
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --immutable

            - name: Detect changed packages
              id: changes
              env:
                  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: |
                  all=$(for d in packages/*/; do basename "$d"; done | xargs)
                  shared=false
                  if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                      changed=$(git diff --name-only "$BASE" HEAD)
                      check=$(echo "$changed" | sed -nE 's#^packages/([^/]+)/.*#\1#p' | sort -u | xargs)
                      if echo "$changed" | grep -q '^shared/'; then
                          echo "Shared code changed, it is bundled into every package."
                          shared=true
                          check=$all
                      fi
                      if echo "$changed" | grep -q '^\.github/workflows/'; then
                          echo "Workflow changed, checking everything."
                          shared=true
                          check=$all
                      fi
                  else
                      echo "Base commit not found, checking everything."
                      shared=true
                      check=$all
                  fi
                  {
                      echo "shared=$shared"
                      echo "check=$check"
                  } | tee -a "$GITHUB_OUTPUT"

            - name: Check shared code
              if: steps.changes.outputs.shared == 'true'
              run: |
                  yarn c:config
                  yarn c:syntax

            - name: Check changed packages
              if: steps.changes.outputs.check != ''
              env:
                  PACKAGES: ${{ steps.changes.outputs.check }}
              run: |
                  for p in $PACKAGES; do
                      echo "::group::$p"
                      yarn "c:$p"
                      node "packages/$p/bin/main.js"
                      echo "::endgroup::"
                  done

            # monorepo moves tags a rebase left behind, then bumps the versions of the
            # packages changed since their last version by conventional commits, see
            # monorepo.config.ts, each committed and tagged, and pushes it all;
            # pushes of the workflow token start no runs, so this does not loop
            - name: Version changed packages
              id: version
              if: github.event_name == 'push' || inputs.publish
              run: |
                  # only the latest commit is released, an older run leaves it to the newer one
                  if [ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" != "$(git rev-parse HEAD)" ]; then
                      echo "::notice::$GITHUB_REF_NAME moved on, the run of its latest commit releases it."
                      echo "skip=true" | tee -a "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  yarn b:monorepo
                  node packages/monorepo/bin/main.js --push

            # a package is published when its package.json version is not on npm yet,
            # after the packages it depends on, see yarn p:all
            - name: Publish new versions
              if: (github.event_name == 'push' || inputs.publish) && steps.version.outputs.skip != 'true'
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  CHECKED: ${{ steps.changes.outputs.check }}
                  SHARED: ${{ steps.changes.outputs.shared }}
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                      echo "::error::The NPM_TOKEN secret is not set."
                      exit 1
                  fi
                  for dir in shared/*/ packages/*/; do
                      p=$(basename "$dir")
                      name=$(node -p "require('./${dir}package.json').name")
                      version=$(node -p "require('./${dir}package.json').version")
                      if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
                          echo "$name@$version is already on npm."
                          continue
                      fi
                      # packages left out of the checks are built and tested first
                      if [ "$dir" = "shared/$p/" ] && [ "$SHARED" = true ]; then
                          continue
                      fi
                      case " $CHECKED " in
                          *" $p "*) continue ;;
                      esac
                      echo "::group::check $name@$version"
                      yarn "c:$p"
                      echo "::endgroup::"
                  done
                  yarn p:all
